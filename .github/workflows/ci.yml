name: CI/CD Backend

on:
  push:
    branches: [main, 'ci/**', 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela ejecuciones anteriores de la misma rama si llega un push nuevo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------
  # 1. Verificación estática: instala dependencias y revisa sintaxis
  # --------------------------------------------------------------------
  lint:
    name: Verificación de sintaxis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Revisar sintaxis de todos los archivos JS
        run: find src tests public/js -name '*.js' -print0 | xargs -0 -n1 node --check

  # --------------------------------------------------------------------
  # 2. Pruebas unitarias (sin base de datos) en varias versiones de Node
  # --------------------------------------------------------------------
  unit-tests:
    name: Pruebas unitarias (Node ${{ matrix.node }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Ejecutar pruebas unitarias con cobertura
        run: npm run test:coverage
      - name: Subir reporte de cobertura
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # --------------------------------------------------------------------
  # 3. Pruebas de integración contra MySQL 8 real
  # --------------------------------------------------------------------
  integration-tests:
    name: Pruebas de integración (MySQL 8)
    needs: lint
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: cyber_tycoon
      # Valores solo de prueba; los reales van en GitHub Secrets / .env del servidor
      JWT_SECRET: jwt_secret_ci
      ADMIN_REGISTRATION_KEY: clave_maestra_ci
      RUN_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Crear esquema y datos semilla (database/init.sql)
        run: mysql -h 127.0.0.1 -uroot -proot < database/init.sql
      - name: Ejecutar pruebas de integración
        run: npm run test:integration

  # --------------------------------------------------------------------
  # 4. Prueba de arranque: el servidor levanta y /api/health responde
  # --------------------------------------------------------------------
  smoke-test:
    name: Prueba de arranque (smoke test)
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: cyber_tycoon
      JWT_SECRET: jwt_secret_ci
      ADMIN_REGISTRATION_KEY: clave_maestra_ci
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - run: mysql -h 127.0.0.1 -uroot -proot < database/init.sql
      - name: Levantar servidor y consultar /api/health
        run: |
          npm start &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/health; then
              echo ""
              echo "Servidor respondió correctamente"
              curl -sf -o /dev/null http://localhost:3000/admin-dashboard/ && echo "Dashboard servido correctamente"
              exit 0
            fi
            sleep 1
          done
          echo "El servidor no respondió en 20 segundos"
          exit 1

  # --------------------------------------------------------------------
  # 5. Auditoría de dependencias (informativa, no bloquea)
  # --------------------------------------------------------------------
  security-audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm audit --omit=dev --audit-level=high

  # --------------------------------------------------------------------
  # 6. CD: empaqueta una versión lista para desplegar (solo en main)
  # --------------------------------------------------------------------
  package:
    name: Empaquetar build (CD)
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - name: Crear paquete de despliegue
        run: tar -czf cyber-tycoon-api-${{ github.sha }}.tar.gz src public database node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: cyber-tycoon-api-build
          path: cyber-tycoon-api-*.tar.gz
          retention-days: 30
