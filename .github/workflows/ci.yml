name: CI/CD Backend

on:
  push:
    branches: [main, 'ci/**', 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela ejecuciones anteriores de la misma rama si llega un push nuevo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 20
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # --------------------------------------------------------------------
  # 1. Análisis estático de código (Linting con ESLint)
  # --------------------------------------------------------------------
  lint:
    name: Linting (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar ESLint
        run: npm run lint

  # --------------------------------------------------------------------
  # 2. Pruebas unitarias (sin base de datos) en varias versiones de Node
  # --------------------------------------------------------------------
  unit-tests:
    name: Pruebas unitarias (Node ${{ matrix.node }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v5
      - name: Configurar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas unitarias con cobertura
        run: npm run test:coverage
      - name: Subir reporte de cobertura
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # --------------------------------------------------------------------
  # 3. Pruebas de integración contra MySQL 8 real
  # --------------------------------------------------------------------
  integration-tests:
    name: Pruebas de integración (MySQL 8)
    needs: lint
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: cyber_tycoon
      # Valores solo de prueba; los reales van en GitHub Secrets / .env del servidor
      JWT_SECRET: jwt_secret_ci
      ADMIN_REGISTRATION_KEY: clave_maestra_ci
      RUN_INTEGRATION: 'true'
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Crear esquema y datos semilla (database/init.sql)
        run: mysql -h 127.0.0.1 -uroot -proot < database/init.sql
      - name: Ejecutar pruebas de integración
        run: npm run test:integration

  # --------------------------------------------------------------------
  # 4. Prueba de arranque: el servidor levanta y /api/health responde
  # --------------------------------------------------------------------
  smoke-test:
    name: Prueba de arranque (smoke test)
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: cyber_tycoon
      JWT_SECRET: jwt_secret_ci
      ADMIN_REGISTRATION_KEY: clave_maestra_ci
      PORT: 3000
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias de producción
        run: npm ci --omit=dev
      - name: Crear esquema y datos semilla
        run: mysql -h 127.0.0.1 -uroot -proot < database/init.sql
      - name: Levantar servidor y consultar /api/health
        run: |
          npm start &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/health; then
              echo ""
              echo "Servidor respondió correctamente"
              curl -sf -o /dev/null http://localhost:3000/admin-dashboard/ && echo "Dashboard servido correctamente"
              exit 0
            fi
            sleep 1
          done
          echo "El servidor no respondió en 20 segundos"
          exit 1

  # --------------------------------------------------------------------
  # 5a. Análisis de vulnerabilidades en dependencias (npm audit)
  # --------------------------------------------------------------------
  dependency-audit:
    name: Vulnerabilidades en dependencias (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar npm audit y generar reporte JSON
        # npm audit sale con código 1 cuando encuentra vulnerabilidades;
        # el reporte se conserva y el resumen se publica en el paso siguiente.
        run: npm audit --omit=dev --json > npm-audit.json || true
      - name: Publicar resumen en la ejecución
        run: |
          node -e "
          const r = require('./npm-audit.json');
          const m = r.metadata.vulnerabilities;
          const rows = Object.values(r.vulnerabilities || {})
            .map(v => '| ' + v.name + ' | ' + v.severity + ' | ' + v.range + ' | ' + (v.fixAvailable ? 'Sí' : 'No') + ' |');
          const out = [
            '## Vulnerabilidades en dependencias de producción',
            '',
            'Críticas: ' + m.critical + ' · Altas: ' + m.high + ' · Moderadas: ' + m.moderate + ' · Bajas: ' + m.low,
            '',
            '| Paquete | Severidad | Versiones afectadas | Corrección disponible |',
            '| --- | --- | --- | --- |',
            ...rows
          ].join('\n');
          require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + '\n');
          console.log(out);
          "
      - name: Subir reporte de vulnerabilidades
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 30

  # --------------------------------------------------------------------
  # 5b. Análisis de vulnerabilidades en el código fuente (CodeQL / SAST)
  # --------------------------------------------------------------------
  codeql:
    name: Vulnerabilidades en el código (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v5
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analizar código
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  # --------------------------------------------------------------------
  # 6. Empaquetado: construye la imagen Docker y la publica en GitHub Packages (ghcr.io)
  # --------------------------------------------------------------------
  docker-package:
    name: Empaquetado y publicación (Docker / GHCR)
    needs: [smoke-test, dependency-audit, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v5
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generar etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Probar la imagen construida
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name ct-api -p 3000:3000 -e JWT_SECRET=ci "$IMAGE"
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://localhost:3000/admin-dashboard/; then
              echo "La imagen arranca y sirve el dashboard"
              docker rm -f ct-api
              exit 0
            fi
            sleep 1
          done
          docker logs ct-api
          exit 1
      - name: Iniciar sesión en GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagen en GitHub Packages
        if: github.event_name != 'pull_request'
        run: docker push --all-tags "$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
      - name: Resumen del paquete publicado
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Imagen publicada"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
